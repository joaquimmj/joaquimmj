  </g>
  <!-- right column: three key figures -->
  <g class="rise d3" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
    <text x="860" y="150" font-size="22" font-weight="600" fill="#e6edf3">3.5% → 0</text><text x="860" y="170" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">figures wrong: web search vs sourced data</text>
    <text x="860" y="210" font-size="22" font-weight="600" fill="#e6edf3">5K</text><text x="860" y="230" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">users on QuantAcademy, built solo</text>
    <text x="860" y="270" font-size="22" font-weight="600" fill="#e6edf3">18M+</text><text x="860" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">organic views, $0 in ads</text>
