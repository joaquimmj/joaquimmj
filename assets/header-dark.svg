    <rect x="775" y="205" width="9" height="9" fill="#3fb27f" stroke="#0d1117" stroke-width="2"/>
    <text x="84" y="183" font-family="Newsreader, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="58" fill="#e6edf3">Joaquim Manji-Jung</text>
  </g>
  <g class="rise d3">
    <text x="62" y="252" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">I build AI tools for finance, and study how LLM agents get numbers wrong.</text>
