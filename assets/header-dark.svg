    <text x="78" y="80" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#6e7681">B2</text>
    <line x1="108" y1="64" x2="108" y2="86" stroke="#262c36"/>
    <text x="122" y="80" font-family="Newsreader, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#6e7681">fx</text>
    <text x="148" y="80" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">=BUILD(<tspan fill="#3fb27f">"AI tools"</tspan>, <tspan fill="#3fb27f">"finance"</tspan>)</text>
